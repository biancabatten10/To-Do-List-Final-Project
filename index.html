<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="final.css">
    <style>
        body {
            background-color: rgb(27, 26, 26) ;
        }
    </style>
</head>
<body>
    <!--Contains everything-->
    <div id="big-div">

        <!--Header container-->
        <div id="header-div">
            <header>
                 <h1 id="title"> To-Do-List </h1>
                <h3>Get organized here!</h3>
            </header>
        
        </div>

        <!--Create item container (new to-do items)-->
        <div id="create-item-box">

            <!-- Input item (to-do items) -->
            <div class="input-item">
                <input
                    id="to-do-input"
                    placeholder="Add a to-do item...">
                </input>
                

                <div class="btn-row">
                    <button id="addBtn" class="btn btn-primary">Add</button>
                    <button id="clearBtn" class="btn btn-danger">Clear All</button> 
                </div>
            </div>

            <!-- Stats bar -->
            <div class="stats-bar">
                <span id="toDoCount">0 items on To-Do List</span>
            </div>

            <!-- Notes list -->
            <div id="toDoList" class="toDo-list">

            <!-- notes are rendered here by JavaScript -->
            </div>
        </div>
        


    </div>
    <script src="final.js"></script>
</body>
</html>
